services:
  postgres:
    image: postgres:18
    container_name: courier-postgres
    environment:
      POSTGRES_DB: courier_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - courier-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: courier-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  ms-courier:
    build: .
    container_name: ms-courier
    depends_on:
      - postgres
      - rabbitmq
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/courier_db
      DB_USERNAME: postgres
      DB_PASSWORD: 12345
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      COURIER_RABBITMQ_ENABLED: true
    ports:
      - "8082:8082"

volumes:
  courier-postgres-data:
