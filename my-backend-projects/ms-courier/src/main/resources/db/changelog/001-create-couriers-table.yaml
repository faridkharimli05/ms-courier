databaseChangeLog:
  - changeSet:
      id: 001-create-couriers-table
      author: faridkarimli
      changes:
        - createTable:
            tableName: couriers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: FREE
                  constraints:
                    nullable: false